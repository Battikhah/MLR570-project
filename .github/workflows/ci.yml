name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@22695119d769bdb6f7032ad67b9bca0ef8c4a174 # v5.4.0
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -m "not slow and not requires_data"
      - run: uv run python scripts/check_repo_hygiene.py
      - run: uv run python scripts/build_literature_docs.py && git diff --exit-code -- docs/literature && test -z "$(git status --porcelain -- docs/literature)"
