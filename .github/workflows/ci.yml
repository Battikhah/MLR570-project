name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -m "not slow and not requires_data"
      - run: uv run python scripts/check_repo_hygiene.py
      - run: uv run python scripts/build_literature_docs.py && git diff --exit-code -- docs/literature
